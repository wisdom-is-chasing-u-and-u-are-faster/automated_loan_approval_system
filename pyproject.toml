[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated_loan_approval_system"
version = "1.0.0"
description = "Enterprise Automatic Loan Approval System (ALAS) Cloud-Native Platform"
authors = [
    { name = "ALAS Architecture Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.1",
    "ruff>=0.0.280",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
